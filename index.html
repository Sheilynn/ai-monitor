<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 视觉专注力监控 system - GitHub Pages 同源 V2 修正版</title>
    
    <script src="https://fastly.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/vision_bundle.js" crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f0f0f; color: #ddd;
            font-family: "Microsoft YaHei", -apple-system, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }
        .main-container { display: flex; width: 100%; max-width: 1300px; height: 780px; gap: 15px; }
        .video-card { flex: 7; background-color: #161616; border: 1px solid #2d2d2d; border-radius: 12px; padding: 10px; display: flex; position: relative; }
        .video-wrapper { width: 100%; height: 100%; background-color: #000; border-radius: 8px; position: relative; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none; }
        .side-panel { width: 360px; background-color: #161616; border: 1px solid #2d2d2d; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .panel-title { color: #00d1ff; font-size: 20px; font-weight: bold; }
        .group-box { border: 1px solid #333; border-radius: 8px; padding: 15px; position: relative; }
        .group-box .legend { position: absolute; top: -10px; left: 15px; background-color: #161616; padding: 0 5px; color: #888; font-size: 13px; font-weight: bold; }
        .data-list { display: flex; flex-direction: column; gap: 12px; margin-top: 5px; }
        .data-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .data-value { color: #00d1ff; font-weight: bold; font-family: "Consolas", monospace; font-size: 16px; }
        .status-card { background-color: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 15px; transition: all 0.3s; }
        .status-card.alert-mode { background-color: #441111; border: 1px solid #ff4444; }
        .status-text { font-size: 15px; font-weight: bold; margin-bottom: 4px; }
        .spacer { flex-grow: 1; }
        button { width: 100%; color: white; font-weight: bold; padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; }
        .manual-btn { background-color: #ff6600; }
        .baseline-btn { background-color: #0066cc; }
        button:disabled { background-color: #444 !important; color: #888; cursor: not-allowed; }
        .progress-bar-container { width: 100%; background-color: #222; border: 1px solid #333; border-radius: 4px; height: 22px; position: relative; display: none; overflow: hidden; }
        .progress-bar-chunk { width: 0%; height: 100%; background-color: #00ff88; }
        .progress-text { position: absolute; width: 100%; text-align: center; top: 0; left: 0; line-height: 20px; font-size: 12px; color: #fff; }
        .system-status { font-weight: bold; color: #ffaa00; display: flex; align-items: center; gap: 5px; font-size: 14px; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 999; visibility: hidden; opacity: 0; transition: opacity 0.2s; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-dialog { background-color: #1a1a1a; border: 1px solid #333; border-radius: 12px; width: 400px; padding: 25px; }
        .modal-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        .btn-confirm { background-color: #00cc66; }
        .form-group { display: flex; align-items: center; margin-bottom: 12px; gap: 10px; }
        .form-group label { width: 80px; font-size: 14px; }
        select, textarea { flex: 1; background-color: #2a2a2a; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 6px; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="video-card">
            <div class="video-wrapper">
                <video id="webcam" autoplay playsinline muted></video>
                <canvas id="output_canvas"></canvas>
            </div>
        </div>

        <div class="side-panel">
            <div class="panel-title">📊 系统监控面板 (V2)</div>
            <div class="group-box">
                <div class="legend">实时生理指标</div>
                <div class="data-list">
                    <div class="data-row"><span>👁️ 眼部开合度(EAR):</span><span id="earVal" class="data-value">0.00</span></div>
                    <div class="data-row"><span>👄 嘴巴开合度(MAR):</span><span id="marVal" class="data-value">0.00</span></div>
                    <div class="data-row"><span>🛡️ 环境置信度:</span><span id="confVal" class="data-value">0%</span></div>
                    <div class="data-row"><span>😴 疲劳误报率:</span><span id="fatigueFpVal" class="data-value">0%</span></div>
                    <div class="data-row"><span>😵 分心误报率:</span><span id="distFpVal" class="data-value">0%</span></div>
                </div>
            </div>

            <div id="statusCard" class="status-card">
                <div id="fatigueLabel" class="status-text">疲劳状态: --</div>
                <div id="distLabel" class="status-text">注意力状态: --</div>
            </div>
            <div class="spacer"></div>
            <div class="group-box">
                <div class="legend">📝 手动记录</div>
                <button class="manual-btn" onclick="openManualModal()">📍 记录当前状态</button>
            </div>
            <button id="baselineBtn" class="baseline-btn" onclick="startCalibration()">📷 捕获多点全域基线</button>
            <div id="progressBar" class="progress-bar-container">
                <div id="progressBarChunk" class="progress-bar-chunk"></div>
                <div id="progressText" class="progress-text">0%</div>
            </div>
            <div id="systemStatus" class="system-status">
                <span id="statusDot">●</span> <span id="statusText">正在拉起 V2 算力内核...</span>
            </div>
        </div>
    </div>

    <div id="alertModal" class="modal-overlay">
        <div class="modal-dialog">
            <div id="alertTitle" class="modal-title" style="color:#ff4444;">检测到异常！</div>
            <div class="modal-content" style="text-align: center;">
                <p id="alertReason" style="margin-bottom: 15px;">原因: --</p>
                <p>请确认这是否为真实的异常：</p>
            </div>
            <div class="modal-buttons">
                <button class="btn-confirm" onclick="handleAlertConfirm(true)">✓ 确认异常</button>
                <button style="background-color:#cc4444;" onclick="handleAlertConfirm(false)">✗ 误报</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');

        let faceLandmarker;
        let lastVideoTime = -1;
        let EAR_THRESHOLD = 0.22;
        let MAR_THRESHOLD = 0.45;
        let isCalibrating = false;
        let currentAlert = null;

        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2) + Math.pow(p1.z - p2.z, 2));
        }

        function getEyeEAR(p1, p2, p3, p4, p5, p6) {
            return (getDistance(p2, p6) + getDistance(p3, p5)) / (2.0 * getDistance(p1, p4));
        }

        function calculateEAR(landmarks) {
            const leftEAR = getEyeEAR(landmarks[33], landmarks[160], landmarks[158], landmarks[133], landmarks[153], landmarks[144]);
            const rightEAR = getEyeEAR(landmarks[362], landmarks[385], landmarks[387], landmarks[263], landmarks[373], landmarks[380]);
            return parseFloat(((leftEAR + rightEAR) / 2.0).toFixed(2));
        }

        function calculateMAR(landmarks) {
            return parseFloat((getDistance(landmarks[13], landmarks[14]) / getDistance(landmarks[78], landmarks[308])).toFixed(2));
        }

        function updateUI(id, val) {
            const el = document.getElementById(id);
            if (el) el.innerText = val;
        }

        function showAlert(title, msg) {
            if (currentAlert) return;
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertReason').innerText = `原因: ${msg}`;
            document.getElementById('alertModal').classList.add('active');
            currentAlert = { title, msg };
        }

        function handleAlertConfirm(isReal) {
            document.getElementById('alertModal').classList.remove('active');
            currentAlert = null;
        }

        function startCalibration() {
            if (isCalibrating) return;
            isCalibrating = true;
            document.getElementById('baselineBtn').disabled = true;
            document.getElementById('progressBar').style.display = 'block';
            let step = 0;
            const interval = setInterval(() => {
                step++;
                const pct = Math.round((step / 20) * 100);
                document.getElementById('progressBarChunk').style.width = pct + '%';
                document.getElementById('progressText').innerText = pct + '%';
                if (step >= 20) {
                    clearInterval(interval);
                    document.getElementById('progressBar').style.display = 'none';
                    document.getElementById('baselineBtn').disabled = false;
                    isCalibrating = false;
                    updateUI('statusText', '✅ 全域边界校准完毕');
                }
            }, 100);
        }

        function renderLoop() {
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                
                if (canvas.width !== video.videoWidth) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const startTimeMs = performance.now();
                const results = faceLandmarker.detectForVideo(video, startTimeMs);

                if (!results.faceLandmarks || results.faceLandmarks.length === 0) {
                    updateUI('statusText', '⚠️ 视线未锁定核心区域');
                    updateUI('confVal', '0%');
                } else {
                    updateUI('confVal', '100%');
                    const face = results.faceLandmarks[0];
                    const ear = calculateEAR(face);
                    const mar = calculateMAR(face);

                    updateUI('earVal', ear.toFixed(2));
                    updateUI('marVal', mar.toFixed(2));

                    ctx.fillStyle = '#00d1ff';
                    [33, 133, 159, 145, 13, 14, 78, 308].forEach(i => {
                        const pt = face[i];
                        ctx.beginPath();
                        ctx.arc(pt.x * canvas.width, pt.y * canvas.height, 3, 0, 2 * Math.PI);
                        ctx.fill();
                    });

                    const isFatigue = ear < EAR_THRESHOLD;
                    const isDistracted = mar > MAR_THRESHOLD;

                    updateUI('fatigueLabel', `疲劳状态: ${isFatigue ? '⚠️ ALERT' : 'NORMAL'}`);
                    updateUI('distLabel', `注意力状态: ${isDistracted ? '⚠️ DISTRACTED' : 'NORMAL'}`);

                    const card = document.getElementById('statusCard');
                    if (isFatigue || isDistracted) {
                        card.classList.add('alert-mode');
                        if (!currentAlert && !isCalibrating) {
                            showAlert('检测到异常状态', isFatigue ? 'PERCLOS - 闭眼时间过长' : 'YAWN - 连续大哈欠');
                        }
                    } else {
                        card.classList.remove('alert-mode');
                    }

                    if (!isCalibrating) {
                        updateUI('statusText', '监控中');
                        document.getElementById('systemStatus').style.color = "#00ff88";
                    }
                }
            }
            requestAnimationFrame(renderLoop);
        }

        async function setup() {
            try {
                // 🚀 【核心修复】：彻底废弃错误的 locateFile 参数，改用符合 V2 规范的稳定 CDN 作为 Wasm 编译器基础
                const vision = await mediapipe.tasks.vision;
                const filesetResolver = await vision.FilesetResolver.forVisionTasks(
                    "https://fastly.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm"
                );

                // 获取并规范化当前 GitHub Pages 部署路径
                const currentOrigin = window.location.origin + window.location.pathname;
                const basePath = currentOrigin.endsWith('.html') 
                    ? currentOrigin.substring(0, currentOrigin.lastIndexOf('/') + 1) 
                    : (currentOrigin.endsWith('/') ? currentOrigin : currentOrigin + '/');

                // 🚀 【同源配置】：从你自己的 GitHub 仓库根目录完全同源加载单个 task 模型文件
                faceLandmarker = await vision.FaceLandmarker.createFromOptions(filesetResolver, {
                    baseOptions: {
                        modelAssetPath: basePath + "face_landmarker.task", 
                        delegate: "GPU"
                    },
                    outputFaceBlendshapes: false,
                    runningMode: "VIDEO",
                    numFaces: 1
                });

                // 唤醒摄像头
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                video.srcObject = stream;
                video.addEventListener("loadeddata", () => {
                    updateUI('statusText', '监控中');
                    document.getElementById('systemStatus').style.color = "#00ff88";
                    renderLoop();
                });
                
            } catch (error) {
                console.error("V2 算力引擎内核崩溃: ", error);
                updateUI('statusText', '❌ 算力核心初始化失败');
                document.getElementById('systemStatus').style.color = "#ff3333";
            }
        }

        window.addEventListener('load', setup);
    </script>
</body>
</html>
