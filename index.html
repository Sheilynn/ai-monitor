<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 视觉专注力监控系统 - 前后端级联国内加速版</title>
    <script src="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/mediapipe__camera_utils/0.2/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/mediapipe__face_mesh/0.4/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0f0f0f; color: #ddd; font-family: "Microsoft YaHei", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .main-container { display: flex; width: 100%; max-width: 1300px; height: 750px; gap: 15px; }
        .video-card { flex: 7; background-color: #161616; border: 1px solid #2d2d2d; border-radius: 12px; padding: 10px; position: relative; }
        .video-wrapper { width: 100%; height: 100%; background-color: #000; border-radius: 8px; position: relative; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none; }
        .side-panel { width: 360px; background-color: #161616; border: 1px solid #2d2d2d; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .panel-title { color: #00d1ff; font-size: 20px; font-weight: bold; }
        .group-box { border: 1px solid #333; border-radius: 8px; padding: 15px; position: relative; }
        .group-box .legend { position: absolute; top: -10px; left: 15px; background-color: #161616; padding: 0 5px; color: #888; font-size: 13px; font-weight: bold; }
        .data-list { display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
        .data-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .data-value { color: #00d1ff; font-weight: bold; font-family: "Consolas", monospace; font-size: 15px; }
        .status-card { background-color: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 15px; }
        .status-text { font-size: 14px; font-weight: bold; }
        .system-status { font-size: 13px; font-weight: bold; color: #888; display: flex; align-items: center; gap: 5px; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="video-card">
            <div class="video-wrapper">
                <video id="webcam" autoplay playsinline muted></video>
                <canvas id="output_canvas"></canvas>
            </div>
        </div>

        <div class="side-panel">
            <div class="panel-title">📡 边缘特征提取端</div>

            <div class="group-box">
                <div class="legend">实时生理指标 (Web 采集)</div>
                <div class="data-list">
                    <div class="data-row"><span>👁️ 原始 EAR:</span><span id="earVal" class="data-value">0.000</span></div>
                    <div class="data-row"><span>👄 原始 MAR:</span><span id="marVal" class="data-value">0.000</span></div>
                    <div class="data-row"><span>🧭 估计 Yaw:</span><span id="yawVal" class="data-value">0.0°</span></div>
                    <div class="data-row"><span>📐 估计 Pitch:</span><span id="pitchVal" class="data-value">0.0°</span></div>
                </div>
            </div>

            <div class="status-card">
                <div id="syncStatus" class="status-text" style="color: #aa99ff;">数据总线: 正在加载引擎...</div>
            </div>

            <div style="flex-grow: 1;"></div>

            <div id="systemStatus" class="system-status">
                <span id="statusDot" style="color: #ffaa00;">●</span> <span id="statusText">正在初始化本地底座...</span>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');

        const BACKEND_API_URL = "http://127.0.0.1:8000/api/stream_data";

        function getDistance3D(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2) + Math.pow(p1.z - p2.z, 2));
        }

        function onResults(results) {
            if (canvas.width !== video.videoWidth) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) return;

            const face = results.multiFaceLandmarks[0];

            // 提取基础生理特征指标
            const leftEAR = (getDistance3D(face[159], face[145]) + getDistance3D(face[158], face[153])) / (2.0 * getDistance3D(face[33], face[133]));
            const rightEAR = (getDistance3D(face[385], face[373]) + getDistance3D(face[387], face[380])) / (2.0 * getDistance3D(face[362], face[263]));
            const ear = (leftEAR + rightEAR) / 2.0;
            const mar = getDistance3D(face[13], face[14]) / getDistance3D(face[78], face[308]);

            const yaw = Math.abs((getDistance3D(face[234], face[4]) / (getDistance3D(face[234], face[4]) + getDistance3D(face[454], face[4])) - 0.5) * 120);
            const pitch = Math.abs(((face[10].y - face[4].y) / (face[152].y - face[4].y) - 1.0) * 90);

            // 更新实时面板数据
            document.getElementById('earVal').innerText = ear.toFixed(3);
            document.getElementById('marVal').innerText = mar.toFixed(3);
            document.getElementById('yawVal').innerText = yaw.toFixed(1) + "°";
            document.getElementById('pitchVal').innerText = pitch.toFixed(1) + "°";

            // 绘制精炼面部点阵骨骼拓扑
            ctx.fillStyle = '#00d1ff';
            [33, 133, 13, 14, 4, 10, 152].forEach(i => {
                const pt = face[i];
                ctx.beginPath();
                ctx.arc(pt.x * canvas.width, pt.y * canvas.height, 2, 0, 2 * Math.PI);
                ctx.fill();
            });

            // 打包数据，外发给本地 PyQt5 级联后端
            const payload = {
                ear: ear, mar: mar,
                head_yaw: yaw, head_pitch: pitch, head_roll: 0.0,
                gaze_x: 0.5, gaze_y: 0.5
            };

            fetch(BACKEND_API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(res => {
                if(res.status === "success") {
                    document.getElementById('statusDot').style.color = "#00ff88";
                    document.getElementById('statusText').innerText = "已成功级联到本地 PyQt5 系统";
                    document.getElementById('syncStatus').innerText = res.message;
                }
            })
            .catch(err => {
                // 静默断开设计：本地未运行 Python 时，不弹错误弹窗，只作面板小提示
                document.getElementById('statusDot').style.color = "#ff3333";
                document.getElementById('statusText').innerText = "本地主系统未运行 (边缘独立感知中)";
                document.getElementById('syncStatus').innerText = "本地总线未响应";
            });
        }

        async function setup() {
            try {
                // 🚀 【核心修复】将核心二进制模型资产重定向到字节跳动国内的静态资源镜像源，防止连不上 Google CDN 导致的加载罢工
                const faceMesh = new FaceMesh({
                    locateFile: (file) => {
                        return `https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/mediapipe__face_mesh/0.4/${file}`;
                    }
                });

                faceMesh.setOptions({ 
                    maxNumFaces: 1, 
                    refineLandmarks: true, 
                    minDetectionConfidence: 0.5, 
                    minTrackingConfidence: 0.5 
                });
                
                faceMesh.onResults(onResults);

                // 确保依赖和资源加载后再初始化摄像头
                const camera = new Camera(video, {
                    onFrame: async () => { 
                        await faceMesh.send({ image: video }); 
                    },
                    width: 640, 
                    height: 480
                });

                document.getElementById('syncStatus').innerText = "数据总线: 引擎加载成功，正在唤醒摄像头...";
                await camera.start();
                
                document.getElementById('syncStatus').innerText = "数据总线: 正常传输中";
                document.getElementById('statusDot').style.color = "#ffaa00";
                document.getElementById('statusText').innerText = "边缘端就绪，等待本地 Python 系统拉起...";

            } catch (error) {
                console.error("Initialization Failed: ", error);
                document.getElementById('syncStatus').innerText = "引擎初始化失败，请检查摄像头硬件权限";
                document.getElementById('syncStatus').style.color = "#ff3333";
            }
        }
        
        window.addEventListener('load', setup);
    </script>
</body>
</html>
